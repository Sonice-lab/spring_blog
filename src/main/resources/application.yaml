spring:
  config:
    import: optional:file:.env[.properties] #스프링 .env를 자동으로 읽지 못하기 때문에 읽을 수 있도록 설정 추가
  mustache:
    servlet:
      expose-session-attributes: false #머스태치 파일에서 세션에 담은 값을 바로 사용 가능
  servlet:
    multipart:
      max-file-size: 10MB   # 파일 하나의 최대 크기
      max-request-size: 11MB   # 요청 전체(파일 + 입력값)의 최대 크기
  profiles:
    active: local

server:
  servlet:
    session:
      tracking-modes: cookie    # 세션 번호를 쿠키로만 전달 (주소에 ;jsessionid 를 붙이지 않음)

# 초기 파라미터 설정
oauth:
  kakao:
    client_id: ${KAKAO_CLIENT_ID}
    client_secret: ${KAKAO_CLIENT_SECRET}
    redirect-uri: ${REDIRECT_URI}
    access-token: ${ACCESS_TOKEN}
